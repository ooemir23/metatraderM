version: '3.8'

services:
  # 1. MetaTrader 5 Engine
  metatrader5:
    image: ghcr.io/gmag11/metatrader5-docker:latest
    container_name: mt5-server
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "8001:8001"
      - "18812:18812"
    environment:
      - CUSTOM_USER=admin
      - PASSWORD=Admin12345!
    volumes:
      - mt5_data:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. HMA Trading Web Application
  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volta-trading-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MT5_HOST=metatrader5
      - MT5_PORT=8001
    depends_on:
      - metatrader5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mt5_data:
