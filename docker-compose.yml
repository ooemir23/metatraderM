version: '3.8'

services:
  # 1. MetaTrader 5 Engine
  metatrader5:
    image: ghcr.io/gmag11/metatrader5-docker:latest
    container_name: mt5-server
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - CUSTOM_USER=admin
      - PASSWORD=${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      - RPYC_SUPERVISOR_VERSION=20260918_v7
    volumes:
      - mt5_data:/config
      - ./start.sh:/Metatrader/start.sh:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. HMA Trading Web Application
  web-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volta-trading-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MT5_HOST=metatrader5
      - MT5_PORT=8001
      - MT5_LOGIN=${MT5_LOGIN:-0}
      - MT5_PASSWORD=${MT5_PASSWORD:-}
      - MT5_SERVER=${MT5_SERVER:-Tickmill-Demo}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - mt5_data:/config
    depends_on:
      - metatrader5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mt5_data:
